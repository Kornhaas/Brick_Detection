[tool.poetry]
name = "brick-detection"
version = "0.1.0"
description = "Werkzeuge zur Erkennung von Bausteinen."
authors = ["Brick Detection Team"]
readme = "README.md"
packages = [{ include = "brick_detection", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.13"
pytest = ">=8.3"
ruff = ">=0.8"
pip-audit = "^2.10.1"
setuptools = ">=83.0.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
